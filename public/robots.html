<!DOCTYPE html>
<html>

<head>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="sidebar">

<a href="dashboard.html"><i class="bi bi-grid"></i></a>
<a href="warehouse.html"><i class="bi bi-house"></i></a>
<a href="robots.html"><i class="bi bi-robot"></i></a>

</div>

<div class="main">

<h4>Robot Management</h4>

<div class="row mb-4">

<div class="col-md-6">
<div class="card p-3">
<h6>All Robots</h6>
<h3>210</h3>
</div>
</div>

<div class="col-md-6">
<div class="card p-3">
<h6>Efficiency</h6>
<h3>80%</h3>
</div>
</div>

</div>

<div class="row">

<div class="col-md-8">

<table class="table">

<thead>

<tr>
<th>ID</th>
<th>Task</th>
<th>Area</th>
<th>Time</th>
<th>Status</th>
</tr>

</thead>

<tbody id="robotTable"></tbody>

</table>

</div>

<div class="col-md-4">

<div class="card p-3">

<h6>Task Tracking</h6>

<canvas id="taskChart"></canvas>

</div>

</div>

</div>

</div>

<script>

fetch("/api/robots")
.then(res=>res.json())
.then(data=>{

const table=document.getElementById("robotTable")

data.forEach(r=>{

table.innerHTML+=`

<tr>

<td>${r.id}</td>
<td>${r.task}</td>
<td>${r.area}</td>
<td>${r.time}</td>
<td><span class="robot-status ${r.status}">
${r.status}
</span></td>

</tr>

`

})

})

new Chart(
document.getElementById("taskChart"),
{
type:"doughnut",
data:{
labels:["Complete","Processing","Pending"],
datasets:[{
data:[60,25,15],
backgroundColor:["#28a745","#f0ad4e","#d9534f"]
}]
}
})

</script>

</body>
</html>
