<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Warehouse</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>
body{background:#f6f8fb;}

.sidebar{
width:60px;
height:100vh;
background:#fff;
position:fixed;
border-right:1px solid #ddd;
display:flex;
flex-direction:column;
align-items:center;
padding-top:20px;
}

.sidebar a{
font-size:24px;
margin-bottom:20px;
color:#666;
text-decoration:none;
}

.main{
margin-left:80px;
padding:20px;
}

.card{
border:none;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.05);
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<a href="dashboard.html"><i class="bi bi-grid"></i></a>
<a href="warehouse.html" style="color:#007bff"><i class="bi bi-house"></i></a>
<a href="robots.html"><i class="bi bi-robot"></i></a>
</div>

<div class="main">

<h4 class="mb-4">Inventory Management</h4>

<div class="card p-3 mb-3">

<button class="btn btn-primary w-100 mb-2" id="btnSale">
Simulate Sale
</button>

<button class="btn btn-warning w-100" id="btnImport">
Import Goods
</button>

</div>

<div class="card p-3">
<table class="table">
<thead>
<tr>
<th>Name</th>
<th>Stock</th>
<th>Min</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

</div>

<!-- SALE MODAL -->
<div class="modal fade" id="saleModal" tabindex="-1">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h5 class="modal-title">Simulate Sale</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">

<select id="saleName" class="form-control mb-2"></select>
<input id="saleQty" type="number" class="form-control mb-2" placeholder="Quantity">

</div>
<div class="modal-footer">
<button class="btn btn-primary" id="submitSale">Submit</button>
</div>
</div>
</div>
</div>

<!-- IMPORT MODAL -->
<div class="modal fade" id="importModal" tabindex="-1">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h5 class="modal-title">Import Goods</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">

<select id="importName" class="form-control mb-2"></select>
<input id="importQty" type="number" class="form-control mb-2" placeholder="Quantity">

</div>
<div class="modal-footer">
<button class="btn btn-warning" id="submitImport">Submit</button>
</div>
</div>
</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

let saleModal;
let importModal;

/* INIT SAU KHI LOAD */
window.onload = () => {

saleModal = new bootstrap.Modal(document.getElementById('saleModal'));
importModal = new bootstrap.Modal(document.getElementById('importModal'));

document.getElementById("btnSale").onclick = () => saleModal.show();
document.getElementById("btnImport").onclick = () => importModal.show();

document.getElementById("submitSale").onclick = simulateSale;
document.getElementById("submitImport").onclick = importGoods;

load();

};

/* LOAD DATA */

async function load(){

const res = await fetch("/api/products");
const data = await res.json();

const table = document.getElementById("table");
const saleSelect = document.getElementById("saleName");
const importSelect = document.getElementById("importName");

table.innerHTML = "";
saleSelect.innerHTML = "";
importSelect.innerHTML = "";

data.forEach(p=>{

table.innerHTML += `
<tr>
<td>${p.name}</td>
<td>${p.stock}</td>
<td>${p.minStock}</td>
</tr>`;

saleSelect.innerHTML += `<option value="${p.name}">${p.name}</option>`;
importSelect.innerHTML += `<option value="${p.name}">${p.name}</option>`;

});

}

/* SALE */

async function simulateSale(){

const name = document.getElementById("saleName").value;
const qty = Number(document.getElementById("saleQty").value);

if(!name || qty <= 0){
alert("Invalid input");
return;
}

const res = await fetch("/api/sales",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({ productName:name, quantity:qty })
});

const data = await res.json();
alert(data.message || "Done");

saleModal.hide();
load();

}

/* IMPORT */

async function importGoods(){

const name = document.getElementById("importName").value;
const qty = Number(document.getElementById("importQty").value);

if(!name || qty <= 0){
alert("Invalid input");
return;
}

const res = await fetch("/api/warehouse/import",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({ productName:name, quantity:qty })
});

const data = await res.json();
alert(data.message || "Done");

importModal.hide();
load();

}

</script>

</body>
</html>
