<!DOCTYPE html>
<html>

<head>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="sidebar">

<a href="dashboard.html"><i class="bi bi-grid"></i></a>
<a href="warehouse.html"><i class="bi bi-house"></i></a>
<a href="robots.html"><i class="bi bi-robot"></i></a>

</div>

<div class="main">

<h4>Warehouse</h4>

<div class="card p-3 mb-4">

<h6>Warehouse Summary</h6>

<div class="row">

<div class="col">Total Purchase Order <h5>50</h5></div>
<div class="col">Pending Approval <h5>30</h5></div>
<div class="col">Approved <h5>15</h5></div>
<div class="col">Unapproved <h5>5</h5></div>

</div>

</div>

<div class="card p-3">

<div class="d-flex justify-content-between mb-3">

<h5>Warehouse Items</h5>

<button
class="btn btn-primary btn-sm"
data-bs-toggle="modal"
data-bs-target="#addModal">

Add New Product

</button>

</div>

<table class="table">

<thead>

<tr>
<th>Product</th>
<th>RFID</th>
<th>Expiry</th>
<th>Min Stock</th>
<th>Stock</th>
<th>Action</th>
</tr>

</thead>

<tbody id="table"></tbody>

</table>

</div>

</div>


<!-- ADD PRODUCT MODAL -->

<div class="modal fade" id="addModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Add Product</h5>

<button class="btn-close"
data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<input
id="pname"
class="form-control mb-2"
placeholder="Product Name">

<input
id="prfid"
class="form-control mb-2"
placeholder="RFID">

<input
id="pexpiry"
type="date"
class="form-control mb-2">

<input
id="pmin"
type="number"
class="form-control mb-2"
placeholder="Min Stock">

<input
id="pstock"
type="number"
class="form-control mb-2"
placeholder="Stock">

</div>

<div class="modal-footer">

<button
class="btn btn-primary"
onclick="addProduct()">

Save

</button>

</div>

</div>

</div>

</div>


<script>

/* LOAD PRODUCTS */

async function loadProducts(){

const res = await fetch("/api/products")

const data = await res.json()

const table=document.getElementById("table")

table.innerHTML=""

data.forEach(p=>{

const f = p.fields

table.innerHTML+=`

<tr>

<td>${f.ID_San_Pham || "-"}</td>
<td>${f["Mã RFID"] || "-"}</td>
<td>${f["Hạn sử dụng"] || "-"}</td>
<td>${f["Tồn tối thiểu"] || "-"}</td>
<td>${f["Số lượng hiện tại"] || "-"}</td>

<td>

<div class="dropdown">

<button class="btn btn-light btn-sm dropdown-toggle"
data-bs-toggle="dropdown">

Action

</button>

<ul class="dropdown-menu">

<li><a class="dropdown-item">View Item</a></li>
<li><a class="dropdown-item text-danger">Delete</a></li>

</ul>

</div>

</td>

</tr>

`

})

}

loadProducts()



/* ADD PRODUCT */

async function addProduct(){

const name=document.getElementById("pname").value
const rfid=document.getElementById("prfid").value
const expiry=document.getElementById("pexpiry").value
const minStock=document.getElementById("pmin").value
const stock=document.getElementById("pstock").value

const res = await fetch("/api/products",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
name,
rfid,
expiry,
minStock,
stock
})

})

await res.json()

location.reload()

}

</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
