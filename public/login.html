<!DOCTYPE html>
<html>

<head>

<title>Login</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#eef1f7;
font-family:Arial;
}

.container-box{
display:flex;
width:900px;
background:white;
border-radius:12px;
overflow:hidden;
}

.left{
flex:1;
background:#eef1f7;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
}

.left img{
width:180px;
margin-bottom:15px;
}

.right{
flex:1;
padding:40px;
}

.btn-login{
background:#4a6cf7;
border:none;
}

.btn-login:hover{
background:#3c5ce0;
}

</style>

</head>

<body>

<div class="container-box">

<div class="left">

<img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">

<h4>SUPER MARKET</h4>
<p>MANAGEMENT</p>

</div>

<div class="right">

<img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png"
width="40">

<h4 class="mt-3 mb-3">Welcome Back</h4>

<p id="roleText"></p>

<input
id="user"
class="form-control mb-3"
placeholder="User Name">

<input
id="pass"
type="password"
class="form-control mb-3"
placeholder="Password">

<div class="form-check mb-3">

<input
class="form-check-input"
type="checkbox">

<label class="form-check-label">

Remember me on this computer

</label>

</div>

<button
class="btn btn-primary w-100 btn-login"
onclick="login()">

LOG IN

</button>

<p class="text-center mt-3 text-danger">

Forgot Password?

</p>

</div>

</div>

<script>

const role = localStorage.getItem("role") || "staff"

document.getElementById("roleText").innerText =
"Login as: " + role

function login(){

const u=document.getElementById("user").value
const p=document.getElementById("pass").value

if(role==="manager" && u==="manager" && p==="123456"){

location.href="dashboard.html"

}

else if(role==="staff" && u==="staff" && p==="123456"){

location.href="dashboard.html"

}

else{

alert("Invalid login")

}

}

</script>

</body>
</html>
