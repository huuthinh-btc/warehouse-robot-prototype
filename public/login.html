<!DOCTYPE html>
<html>
<head>
    <title>Login - Super Market</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e9edf6; /* Đồng bộ màu nền với role.html */
            font-family: Arial, sans-serif;
        }

        .container-box {
            display: flex;
            width: 900px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .left {
            flex: 1;
            background: #eef1f7;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 40px;
        }

        .left img {
            width: 180px;
            margin-bottom: 15px;
        }

        .brand-title {
            color: #333;
            font-weight: bold;
            margin-bottom: 0;
        }

        .brand-sub {
            letter-spacing: 4px;
            font-size: 14px;
            color: #777;
        }

        .right {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .btn-login {
            background: #4a6cf7;
            border: none;
            padding: 12px;
            font-weight: bold;
        }

        .btn-login:hover {
            background: #3c5ce0;
        }

        .role-badge {
            display: inline-block;
            background: #eef1ff;
            color: #4a6cf7;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container-box">
        <div class="left">
            <img src="assets/logo.png" alt="Logo">
            <h4 class="brand-title">SUPER MARKET</h4>
            <p class="brand-sub">MANAGEMENT</p>
        </div>

        <div class="right">
            <div class="text-center mb-4">
                <img src="assets/logo.png" width="50" class="mb-3">
                <h4>Welcome Back</h4>
                <div id="roleText" class="role-badge"></div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">User Name</label>
                <input id="user" class="form-control" placeholder="Enter username">
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Password</label>
                <input id="pass" type="password" class="form-control" placeholder="Enter password">
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label small" for="rememberMe">
                    Remember me on this computer
                </label>
            </div>

            <button class="btn btn-primary w-100 btn-login" onclick="login()">
                LOG IN
            </button>

            <p class="text-center mt-4 mb-0">
                <a href="#" class="text-danger text-decoration-none small fw-bold">Forgot Password?</a>
            </p>
        </div>
    </div>

    <script>
        // Lấy role từ localStorage
        const role = localStorage.getItem("role") || "staff";
        document.getElementById("roleText").innerText = "Login as: " + role;

        function login() {
            const u = document.getElementById("user").value;
            const p = document.getElementById("pass").value;

            // Kiểm tra đăng nhập đơn giản
            if (role === "manager" && u === "manager" && p === "123456") {
                location.href = "dashboard.html";
            } 
            else if (role === "staff" && u === "staff" && p === "123456") {
                location.href = "dashboard.html";
            } 
            else {
                alert("Invalid User Name or Password for " + role.toUpperCase() + " role.");
            }
        }

        // Cho phép nhấn Enter để đăng nhập
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>

</body>
</html>
