<!DOCTYPE html>
<html>

<head>

<title>System Access</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>

body{
background:#e9edf6;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial;
}

.container-box{
display:flex;
width:900px;
background:white;
border-radius:12px;
overflow:hidden;
}

.left{
flex:1;
background:#eef1f7;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
}

.left img{
width:180px;
margin-bottom:15px;
}

.right{
flex:1;
padding:40px;
text-align:center;
}

.btn-role{
width:100%;
margin-top:12px;
background:#4a6cf7;
border:none;
}

.btn-role:hover{
background:#3c5ce0;
}

</style>

</head>

<body>

<div class="container-box">

<div class="left">

<img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">

<h4>SUPER MARKET</h4>
<p>MANAGEMENT</p>

</div>

<div class="right">

<img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png"
width="50">

<h4 class="mt-3">System Access</h4>

<p>Select Role</p>

<button
class="btn btn-primary btn-role"
onclick="selectRole('staff')">

STAFF

</button>

<button
class="btn btn-primary btn-role"
onclick="selectRole('manager')">

MANAGER

</button>

</div>

</div>

<script>

function selectRole(role){

localStorage.setItem("role",role)

window.location="login.html"

}

</script>

</body>
</html>
