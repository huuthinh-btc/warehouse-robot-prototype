<!DOCTYPE html>
<html>
<head>
    <title>System Access</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #e9edf6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial;
        }

        .container-box {
            display: flex;
            width: 900px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .left {
            flex: 1;
            background: #eef1f7;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 40px;
        }

        .left img {
            width: 180px;
            margin-bottom: 15px;
        }

        .right {
            flex: 1;
            padding: 60px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .btn-role {
            width: 100%;
            margin-top: 12px;
            background: #4a6cf7;
            border: none;
            padding: 12px;
        }

        .btn-role:hover {
            background: #3c5ce0;
        }
    </style>
</head>
<body>

    <div class="container-box">
        <div class="left">
            <img src="assets/logo.png">
            <h4>SUPER MARKET</h4>
            <p style="letter-spacing: 3px;">MANAGEMENT</p>
        </div>

        <div class="right">
            <img src="assets/logo.png" width="50" style="margin: 0 auto 15px auto;">
            <h4 class="mt-3">System Access</h4>
            <p class="text-secondary">Select Role</p>

            <button class="btn btn-primary btn-role" onclick="selectRole('staff')">
                STAFF
            </button>

            <button class="btn btn-primary btn-role" onclick="selectRole('manager')">
                MANAGER
            </button>
        </div>
    </div>

    <script>
        function selectRole(role) {
            localStorage.setItem("role", role);
            window.location = "login.html";
        }
    </script>
</body>
</html>
